name: CI

on:
  push:
    branches: [main, "tauri-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test + build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libx11-dev libxtst-dev libxi-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Syntax check
        shell: bash
        run: for f in web/engine.mjs web/live.mjs; do node --check "$f"; done
      - run: node tools/prepare-web.mjs
      - name: Compile the Tauri app
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
