name: Release

# Push a tag like v0.1.0 (it must match "version" in package.json) to build installers for
# Windows, macOS (Intel + Apple Silicon) and Linux, and publish them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json version v$v"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: installers-*
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Hinglish Typer ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file <(cat <<'NOTES'
          Offline Hinglish → Devanagari typing for Windows, macOS and Linux, powered by Lekhani (Udgam Labs, Apache-2.0).

          **Install**
          - Windows: run the `.exe` installer (SmartScreen may warn: the build is unsigned, choose *More info → Run anyway*).
          - macOS: open the `.dmg`, drag to Applications, then right-click → Open the first time (unsigned). Grant Accessibility and Input Monitoring.
          - Linux: `chmod +x *.AppImage && ./Hinglish-Typer-*.AppImage`, or install the `.deb`. X11 session required for live typing.

          Verify downloads with `SHA256SUMS.txt`. See THIRD_PARTY_NOTICES.md for attributions.
          NOTES
          )
